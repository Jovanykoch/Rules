name: Build Rules

permissions:
  contents: read

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-rules
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SING_BOX_VERSION: "1.14.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Install sing-box
        run: |
          set -euo pipefail
          arch="$(dpkg --print-architecture)"
          case "${arch}" in
            amd64) sb_arch="amd64" ;;
            arm64) sb_arch="arm64" ;;
            *) echo "::error::Unsupported architecture: ${arch}" && exit 1 ;;
          esac
          pkg="sing-box_${SING_BOX_VERSION}_linux_${sb_arch}.deb"
          url="https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/${pkg}"
          echo "Downloading ${url}"
          curl --fail --location --show-error --silent --retry 3 --retry-delay 2 \
            --output "${pkg}" "${url}"
          sudo dpkg -i "${pkg}"
          rm -f "${pkg}"

      - name: Run tests
        run: uv run python -m unittest discover -s tests -v

      - name: Generate rules
        working-directory: ${{ github.workspace }}
        run: |
          test -f "${GITHUB_WORKSPACE}/main.py" || {
            echo "::error::main.py is missing from ${GITHUB_WORKSPACE}"
            pwd
            ls -la
            exit 1
          }
          sing-box version
          uv run generate

      - name: Add maintained rules
        run: |
          mkdir -p dist/ext
          cp source/maintained.list dist/ext/maintained.list
          cp source/bili_sgmodule dist/ext/bili.quanx

      - name: Publish rel branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -C dist init --initial-branch=rel
          git -C dist config user.name "github-actions[bot]"
          git -C dist config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C dist add .
          git -C dist commit -m "$(date -u +%Y%m%d%H%M)"
          git -C dist remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C dist push --force origin rel
