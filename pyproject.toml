[project]
name = "rules"
version = "0.1.0"
description = "Automated proxy rules for Clash, Surge, Quantumult X, sing-box, and V2Ray GeoSite"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/Jovanykoch/rules"

[project.scripts]
generate = "main:main"
